<svg width="1120" height="300" viewBox="0 0 1120 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Paulo Correia profile stats cards</title>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020617" flood-opacity=".22"/>
    </filter>
    <style>
      .title { font: 900 16px Inter, Segoe UI, Arial, sans-serif; fill: #FFFFFF; letter-spacing: 0; }
      .big { font: 950 44px Inter, Segoe UI, Arial, sans-serif; fill: #FFFFFF; letter-spacing: 0; }
      .label { font: 850 14px Inter, Segoe UI, Arial, sans-serif; fill: #F8FAFC; letter-spacing: 0; }
      .small { font: 800 12px Inter, Segoe UI, Arial, sans-serif; fill: #E2E8F0; letter-spacing: 0; }
      .bar-label { font: 900 13px Inter, Segoe UI, Arial, sans-serif; fill: #FFFFFF; letter-spacing: 0; }
      .bar-value { font: 950 15px Inter, Segoe UI, Arial, sans-serif; fill: #FFFFFF; letter-spacing: 0; }
      .card-a { animation: floatA 4s ease-in-out infinite; }
      .card-b { animation: floatB 4.6s ease-in-out infinite; }
      .card-c { animation: floatC 5.2s ease-in-out infinite; }
      .grow-java { animation: growJava 3.2s ease-in-out infinite; transform-origin: 150px 208px; }
      .grow-spring { animation: growSpring 3.2s ease-in-out infinite; transform-origin: 150px 234px; }
      .grow-vue { animation: growVue 3.2s ease-in-out infinite; transform-origin: 150px 260px; }
      .grow-sql { animation: growSql 3.2s ease-in-out infinite; transform-origin: 726px 204px; }
      .grow-arch { animation: growArch 3.2s ease-in-out infinite; transform-origin: 726px 226px; }
      .grow-docker { animation: growDocker 3.2s ease-in-out infinite; transform-origin: 726px 248px; }
      .grow-tests { animation: growTests 3.2s ease-in-out infinite; transform-origin: 726px 270px; }
      @keyframes floatA { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes floatB { 0%,100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
      @keyframes floatC { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      @keyframes growJava { 0%,100% { transform: scaleX(.92); } 50% { transform: scaleX(1); } }
      @keyframes growSpring { 0%,100% { transform: scaleX(.84); } 50% { transform: scaleX(.95); } }
      @keyframes growVue { 0%,100% { transform: scaleX(.7); } 50% { transform: scaleX(.82); } }
      @keyframes growSql { 0%,100% { transform: scaleX(.78); } 50% { transform: scaleX(.9); } }
      @keyframes growArch { 0%,100% { transform: scaleX(.78); } 50% { transform: scaleX(.92); } }
      @keyframes growDocker { 0%,100% { transform: scaleX(.62); } 50% { transform: scaleX(.76); } }
      @keyframes growTests { 0%,100% { transform: scaleX(.58); } 50% { transform: scaleX(.72); } }
    </style>
  </defs>

  <g filter="url(#shadow)">
    <g class="card-a">
      <rect x="20" y="24" width="250" height="112" rx="22" fill="#2563EB"/>
      <text x="44" y="58" class="title">trilhas</text>
      <text x="44" y="106" class="big">11</text>
      <text x="116" y="106" class="label">categorias</text>
      <text x="44" y="124" class="small">Java Backend 2026</text>
    </g>

    <g class="card-b">
      <rect x="290" y="24" width="250" height="112" rx="22" fill="#10B981"/>
      <text x="314" y="58" class="title">roadmap</text>
      <text x="314" y="106" class="big">126</text>
      <text x="410" y="106" class="label">topicos</text>
      <text x="314" y="124" class="small">com subtópicos granulares</text>
    </g>

    <g class="card-c">
      <rect x="560" y="24" width="250" height="112" rx="22" fill="#F97316"/>
      <text x="584" y="58" class="title">design</text>
      <text x="584" y="106" class="big">23</text>
      <text x="654" y="106" class="label">GoF patterns</text>
      <text x="584" y="124" class="small">criacionais · estruturais · comport.</text>
    </g>

    <g class="card-a">
      <rect x="830" y="24" width="270" height="112" rx="22" fill="#8B5CF6"/>
      <text x="854" y="58" class="title">backup</text>
      <text x="854" y="96" class="label">localStorage + JSON</text>
      <text x="854" y="122" class="small">progresso versionável no GitHub</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="20" y="156" width="520" height="124" rx="22" fill="#0F172A" fill-opacity=".94"/>
    <text x="44" y="188" class="title">stack principal</text>

    <text x="44" y="214" class="bar-label">Java</text>
    <rect x="150" y="202" width="300" height="11" rx="6" fill="#334155"/>
    <rect class="grow-java" x="150" y="202" width="264" height="11" rx="6" fill="#F97316"/>
    <text x="468" y="214" class="bar-value">88%</text>

    <text x="44" y="240" class="bar-label">Spring</text>
    <rect x="150" y="228" width="300" height="11" rx="6" fill="#334155"/>
    <rect class="grow-spring" x="150" y="228" width="234" height="11" rx="6" fill="#22C55E"/>
    <text x="468" y="240" class="bar-value">78%</text>

    <text x="44" y="266" class="bar-label">Vue/TS</text>
    <rect x="150" y="254" width="300" height="11" rx="6" fill="#334155"/>
    <rect class="grow-vue" x="150" y="254" width="192" height="11" rx="6" fill="#10B981"/>
    <text x="468" y="266" class="bar-value">64%</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="580" y="156" width="520" height="124" rx="22" fill="#0F172A" fill-opacity=".94"/>
    <text x="604" y="188" class="title">apoio tecnico</text>

    <text x="604" y="210" class="bar-label">SQL/JPA</text>
    <rect x="726" y="199" width="270" height="10" rx="5" fill="#334155"/>
    <rect class="grow-sql" x="726" y="199" width="189" height="10" rx="5" fill="#38BDF8"/>
    <text x="1014" y="211" class="bar-value">70%</text>

    <text x="604" y="232" class="bar-label">Arquitetura</text>
    <rect x="726" y="221" width="270" height="10" rx="5" fill="#334155"/>
    <rect class="grow-arch" x="726" y="221" width="194" height="10" rx="5" fill="#A855F7"/>
    <text x="1014" y="233" class="bar-value">72%</text>

    <text x="604" y="254" class="bar-label">Docker</text>
    <rect x="726" y="243" width="270" height="10" rx="5" fill="#334155"/>
    <rect class="grow-docker" x="726" y="243" width="157" height="10" rx="5" fill="#2563EB"/>
    <text x="1014" y="255" class="bar-value">58%</text>

    <text x="604" y="276" class="bar-label">Testes/Sec</text>
    <rect x="726" y="265" width="270" height="10" rx="5" fill="#334155"/>
    <rect class="grow-tests" x="726" y="265" width="149" height="10" rx="5" fill="#F59E0B"/>
    <rect class="grow-tests" x="875" y="265" width="140" height="10" rx="5" fill="#EC4899" opacity=".95"/>
    <text x="1014" y="277" class="bar-value">55/52%</text>
  </g>
</svg>
