<svg width="1120" height="300" viewBox="0 0 1120 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Paulo Correia colorful profile stats panel</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1120" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9"/>
      <stop offset="0.28" stop-color="#10B981"/>
      <stop offset="0.58" stop-color="#F59E0B"/>
      <stop offset="0.82" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="lightA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(158 78) rotate(36) scale(238 118)">
      <stop stop-color="#FFFFFF" stop-opacity=".65"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lightB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(910 214) rotate(138) scale(260 150)">
      <stop stop-color="#FFFFFF" stop-opacity=".42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0F172A" flood-opacity=".22"/>
    </filter>
    <style>
      .kicker { font: 900 13px Inter, Segoe UI, Arial, sans-serif; fill: #DBEAFE; letter-spacing: 0; }
      .big { font: 950 42px Inter, Segoe UI, Arial, sans-serif; fill: #FFFFFF; letter-spacing: 0; }
      .num { font: 950 40px Inter, Segoe UI, Arial, sans-serif; fill: #FFFFFF; letter-spacing: 0; }
      .label { font: 900 14px Inter, Segoe UI, Arial, sans-serif; fill: #E2E8F0; letter-spacing: 0; }
      .card-title { font: 900 15px Inter, Segoe UI, Arial, sans-serif; fill: #FFFFFF; letter-spacing: 0; }
      .percent { font: 950 20px Inter, Segoe UI, Arial, sans-serif; fill: #FFFFFF; letter-spacing: 0; }
      .bar-label { font: 900 13px Inter, Segoe UI, Arial, sans-serif; fill: #F8FAFC; letter-spacing: 0; }
      .float-a { animation: floatA 4s ease-in-out infinite; }
      .float-b { animation: floatB 5s ease-in-out infinite; }
      .grow-a { animation: growA 3.4s ease-in-out infinite; transform-origin: 682px 206px; }
      .grow-b { animation: growB 3.4s ease-in-out infinite; transform-origin: 682px 238px; }
      .grow-c { animation: growC 3.4s ease-in-out infinite; transform-origin: 682px 270px; }
      @keyframes floatA { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes floatB { 0%,100% { transform: translateY(0); } 50% { transform: translateY(7px); } }
      @keyframes growA { 0%,100% { transform: scaleX(.92); } 50% { transform: scaleX(1); } }
      @keyframes growB { 0%,100% { transform: scaleX(.82); } 50% { transform: scaleX(.95); } }
      @keyframes growC { 0%,100% { transform: scaleX(.72); } 50% { transform: scaleX(.88); } }
    </style>
  </defs>

  <rect width="1120" height="300" rx="28" fill="url(#bg)"/>
  <rect width="1120" height="300" rx="28" fill="url(#lightA)"/>
  <rect width="1120" height="300" rx="28" fill="url(#lightB)"/>

  <g opacity=".36">
    <path d="M36 224 C156 130 262 170 370 78 C468 -6 600 18 696 92 C816 184 924 158 1082 50" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <path d="M74 258 C198 196 326 238 446 154 C588 54 708 80 804 162 C900 244 1008 232 1086 166" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  </g>

  <circle class="float-a" cx="78" cy="70" r="14" fill="#FFFFFF" opacity=".55"/>
  <circle class="float-b" cx="1030" cy="68" r="11" fill="#FFFFFF" opacity=".42"/>
  <circle class="float-a" cx="998" cy="236" r="8" fill="#FFFFFF" opacity=".42"/>
  <circle class="float-b" cx="520" cy="48" r="7" fill="#FFFFFF" opacity=".36"/>

  <text x="58" y="62" class="kicker">p-rcorreia / backend profile</text>
  <text x="58" y="112" class="big">Java Backend</text>
  <text x="58" y="154" class="big">Engineering</text>

  <g filter="url(#shadow)">
    <rect x="58" y="184" width="148" height="74" rx="18" fill="#2563EB"/>
    <text x="80" y="224" class="num">90%</text>
    <text x="82" y="244" class="label">Backend</text>

    <rect x="226" y="184" width="148" height="74" rx="18" fill="#10B981"/>
    <text x="248" y="224" class="num">80%</text>
    <text x="250" y="244" class="label">Arquitetura</text>

    <rect x="394" y="184" width="148" height="74" rx="18" fill="#F97316"/>
    <text x="416" y="224" class="num">70%</text>
    <text x="418" y="244" class="label">Dados</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="586" y="48" width="216" height="112" rx="22" fill="#0F172A" fill-opacity=".86"/>
    <text x="612" y="82" class="card-title">Stack foco</text>
    <text x="612" y="126" class="num">8</text>
    <text x="662" y="126" class="label">tecnologias</text>
    <text x="612" y="146" class="label">Java · Spring · SQL · Docker</text>

    <rect x="824" y="48" width="216" height="112" rx="22" fill="#0F172A" fill-opacity=".86"/>
    <text x="850" y="82" class="card-title">Design</text>
    <text x="850" y="126" class="num">23</text>
    <text x="906" y="126" class="label">patterns</text>
    <text x="850" y="146" class="label">GoF · SOLID · UML</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="586" y="184" width="454" height="74" rx="20" fill="#0F172A" fill-opacity=".86"/>
    <text x="612" y="211" class="bar-label">Spring Boot</text>
    <rect x="724" y="200" width="240" height="11" rx="6" fill="#334155"/>
    <rect class="grow-a" x="724" y="200" width="216" height="11" rx="6" fill="#22C55E"/>
    <text x="984" y="212" class="percent">90%</text>

    <text x="612" y="239" class="bar-label">Testes</text>
    <rect x="724" y="228" width="240" height="11" rx="6" fill="#334155"/>
    <rect class="grow-b" x="724" y="228" width="190" height="11" rx="6" fill="#F59E0B"/>
    <text x="984" y="240" class="percent">75%</text>

    <text x="612" y="267" class="bar-label">Segurança</text>
    <rect x="724" y="256" width="240" height="11" rx="6" fill="#334155"/>
    <rect class="grow-c" x="724" y="256" width="178" height="11" rx="6" fill="#EC4899"/>
    <text x="984" y="268" class="percent">70%</text>
  </g>
</svg>
