<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Paulo Correia — Infrastructure, Cloud and Security Lab</title>
<desc id="desc">Cyber lab terminal-style banner with bold editorial typography, terminal output, and layered network infrastructure diagram.</desc>
