<svg width="1120" height="380" viewBox="0 0 1120 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Paulo Correia Java Backend Roadmap 2026 animated profile hero</title>
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1120" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E0F2FE"/>
      <stop offset="0.45" stop-color="#ECFDF5"/>
      <stop offset="0.72" stop-color="#FEF3C7"/>
      <stop offset="1" stop-color="#F5D0FE"/>
    </linearGradient>
    <linearGradient id="track" x1="70" y1="206" x2="1048" y2="206" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="0.26" stop-color="#10B981"/>
      <stop offset="0.54" stop-color="#F97316"/>
      <stop offset="0.78" stop-color="#DB2777"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="glass" x1="58" y1="48" x2="1060" y2="336" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.58"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <path id="road" d="M72 247 C142 120 213 118 276 238 C338 356 426 338 474 206 C520 82 608 94 660 196 C710 294 790 294 842 164 C888 50 968 74 1048 210"/>
    <style>
      .title { font: 900 44px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .subtitle { font: 700 18px Inter, Segoe UI, Arial, sans-serif; fill: #334155; letter-spacing: 0; }
      .caption { font: 700 14px Inter, Segoe UI, Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .metric { font: 900 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .metric-label { font: 800 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; letter-spacing: 0; }
      .chip { font: 800 13px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .small { font: 800 12px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .float-a { animation: floatA 4s ease-in-out infinite; }
      .float-b { animation: floatB 5s ease-in-out infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      .dash { animation: dash 2.8s linear infinite; }
      @keyframes floatA { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes floatB { 0%,100% { transform: translateY(0); } 50% { transform: translateY(8px); } }
      @keyframes pulse { 0%,100% { opacity: .72; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
      @keyframes dash { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -72; } }
    </style>
  </defs>

  <rect width="1120" height="380" rx="34" fill="url(#heroBg)"/>

  <g opacity="0.72">
    <circle class="float-a" cx="92" cy="72" r="18" fill="#FBBF24"/>
    <circle class="float-b" cx="1018" cy="70" r="12" fill="#60A5FA"/>
    <circle class="pulse" cx="980" cy="312" r="9" fill="#34D399"/>
    <circle class="float-a" cx="222" cy="318" r="8" fill="#FB7185"/>
    <circle class="float-b" cx="775" cy="52" r="10" fill="#A78BFA"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="46" y="34" width="1028" height="312" rx="28" fill="url(#glass)" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <text x="82" y="92" class="caption">p-rcorreia / Java Backend journey</text>
  <text x="82" y="142" class="title">Roadmap Java Backend 2026</text>
  <text x="84" y="176" class="subtitle">Vue + TypeScript + Tailwind + Docker para acompanhar estudo real, com progresso salvo em JSON.</text>

  <g transform="translate(84 214)">
    <rect x="0" y="0" width="138" height="82" rx="18" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="20" y="38" class="metric">11</text>
    <text x="20" y="62" class="metric-label">trilhas</text>
  </g>
  <g transform="translate(238 214)">
    <rect x="0" y="0" width="138" height="82" rx="18" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="20" y="38" class="metric">126</text>
    <text x="20" y="62" class="metric-label">tópicos</text>
  </g>
  <g transform="translate(392 214)">
    <rect x="0" y="0" width="138" height="82" rx="18" fill="#FFF7ED" stroke="#FED7AA"/>
    <text x="20" y="38" class="metric">23</text>
    <text x="20" y="62" class="metric-label">GoF patterns</text>
  </g>

  <g transform="translate(590 64)">
    <rect x="0" y="0" width="416" height="104" rx="22" fill="#0F172A" opacity="0.9"/>
    <text x="24" y="34" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="900">stack atual</text>
    <g transform="translate(24 50)">
      <rect x="0" y="0" width="55" height="26" rx="13" fill="#F97316"/><text x="16" y="18" class="small" fill="#fff">Java</text>
      <rect x="65" y="0" width="72" height="26" rx="13" fill="#22C55E"/><text x="80" y="18" class="small" fill="#fff">Spring</text>
      <rect x="147" y="0" width="45" height="26" rx="13" fill="#38BDF8"/><text x="160" y="18" class="small" fill="#fff">SQL</text>
      <rect x="202" y="0" width="64" height="26" rx="13" fill="#8B5CF6"/><text x="216" y="18" class="small" fill="#fff">Vue 3</text>
      <rect x="276" y="0" width="78" height="26" rx="13" fill="#2563EB"/><text x="290" y="18" class="small" fill="#fff">Docker</text>
      <rect x="0" y="36" width="94" height="26" rx="13" fill="#DB2777"/><text x="14" y="54" class="small" fill="#fff">Security</text>
      <rect x="104" y="36" width="70" height="26" rx="13" fill="#F59E0B"/><text x="118" y="54" class="small" fill="#fff">Tests</text>
      <rect x="184" y="36" width="112" height="26" rx="13" fill="#0F766E"/><text x="198" y="54" class="small" fill="#fff">Architecture</text>
    </g>
  </g>

  <g opacity="0.45" stroke="#94A3B8" stroke-width="2">
    <path d="M158 260V324"/>
    <path d="M278 238V324"/>
    <path d="M426 300V324"/>
    <path d="M556 126V324"/>
    <path d="M724 250V324"/>
    <path d="M888 84V324"/>
    <path d="M1008 184V324"/>
  </g>

  <use href="#road" stroke="#E2E8F0" stroke-width="24" stroke-linecap="round"/>
  <use href="#road" stroke="url(#track)" stroke-width="10" stroke-linecap="round"/>
  <use href="#road" class="dash" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="12 24" opacity="0.9"/>

  <g filter="url(#shadow)">
    <g>
      <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
        <mpath href="#road"/>
      </animateMotion>
      <g transform="translate(-44 -28)">
        <rect x="5" y="12" width="82" height="36" rx="14" fill="#F97316"/>
        <rect x="14" y="4" width="46" height="20" rx="10" fill="#2563EB"/>
        <rect x="58" y="6" width="20" height="18" rx="8" fill="#10B981"/>
        <path d="M18 21H74" stroke="#FED7AA" stroke-width="4" stroke-linecap="round"/>
        <circle cx="24" cy="54" r="9" fill="#0F172A"/>
        <circle cx="68" cy="54" r="9" fill="#0F172A"/>
        <circle cx="24" cy="54" r="3" fill="#CBD5E1"/>
        <circle cx="68" cy="54" r="3" fill="#CBD5E1"/>
        <text x="26" y="37" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="900" fill="#FFFFFF">Java</text>
      </g>
    </g>
  </g>
</svg>
